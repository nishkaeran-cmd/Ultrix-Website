<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultrix</title>
  <style>
    body {
      background-color: #0F172A;
      color: #FFFFFF;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h2 {
      color: #38BDF8;
      font-size: 2rem;
      margin-bottom: 12px;
    }

    p {
      color: #E2E8F0;
      font-size: 1.1rem;
      text-align: justify;
      line-height: 1.6;
    }

    .news-ticker {
      background-color: #FFFFFF;
      color: #000000;
      font-weight: bold;
      padding: 6px 0;
      margin-top: 20px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h2>Ultrix</h2>
  <p>Ultrix is a single dev game development studio.</p>

  <div class="news-ticker">
    <marquee behavior="scroll" direction="left">
      Ultrix is currently in the development of Relay9.
    </marquee>
  </div>

</body>
</html>
